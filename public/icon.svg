<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="210" cy="190" r="95" fill="url(#sun)" filter="url(#shadow)"/>
  <!-- Cloud -->
  <g filter="url(#shadow)" fill="url(#cloud)">
    <circle cx="185" cy="305" r="75"/>
    <circle cx="280" cy="275" r="90"/>
    <circle cx="360" cy="315" r="60"/>
    <rect x="185" y="300" width="175" height="75" rx="35"/>
  </g>
</svg>